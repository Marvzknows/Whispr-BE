services:
  db:
    image: postgres:18
    container_name: auth_template_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_template
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects the volume here (not /var/lib/postgresql/data)
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:

# docker compose up -d        # start (first run downloads the image)
# docker compose ps           # check it's running
# docker compose logs -f db   # watch logs (Ctrl+C to exit)
# docker compose stop         # stop, keep data
# docker compose down         # stop and remove container, keep data
# docker compose down -v      # stop and DELETE all data